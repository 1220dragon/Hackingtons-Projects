<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tier List</title>
  </head>
  <body>
    <input id="name" type="text" placeholder="Name" />
    <input id="img" type="text" placeholder="Image URL here" />
    <input id="rank" type="text" placeholder="Letter Rank" />

    <button onclick="addToList()">Add To Tier List</button>

    <div id="PEAK" class="tier">
      <div class="title">PEAK</div>
    </div>
    <div id="S" class="tier">
      <div class="title">S</div>
    </div>
    <div id="A" class="tier">
      <div class="title">A</div>
    </div>
    <div id="B" class="tier">
      <div class="title">B</div>
    </div>
    <div id="C" class="tier">
      <div class="title">C</div>
    </div>
    <div id="D" class="tier">
      <div class="title">D</div>
    </div>
    <div id="F" class="tier">
      <div class="title">F</div>
    </div>
    <div id="Z" class="tier">
      <div class="title">Z</div>
    </div>
    <div id="UNKNOWN" class="tier">
      <div class="title">?</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
