<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scratch Search</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Search for a Scratch username and see all their projects!</h1>
    <h2 id="marBottom">Now in TurboWarp!</h2>
    <input
      type="text"
      id="searchBar"
      onchange="search(this)"
      placeholder="username"
    />

    <div id="games"></div>

    <script src="script.js"></script>
  </body>
</html>
